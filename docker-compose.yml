services:
  postgres:
    image: postgres:16-alpine
    container_name: dailyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailyos
      POSTGRES_PASSWORD: dailyos
      POSTGRES_DB: dailyos
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
